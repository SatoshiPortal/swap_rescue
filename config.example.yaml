# Example configuration file for swap rescue
# Copy this file to config.yaml and fill in your values

user_input:
  # Your wallet mnemonic (12 or 24 word seed phrase)
  mnemonic: "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"

  # Passphrase for your wallet (leave empty if none)
  passphrase: ""

  # Swap index (0 for first swap, 1 for second, etc.)
  swap_index: 0

  # Address where funds should be sent
  return_address: "lq1qqvpfp28manyd036nrvzs5eeg2y48f48tlf27n68u65esxsgjd3sc3u673rp6dvp0y5mdgxp93aj4w67uu72ajgqyfvvj59h3h"

# Provider input - This section will be filled by your swap provider (BullBitcoin/Aqua)
provider_input:
  # Type of rescue: "claim" or "refund"
  rescue_type: "claim"

  claim_leaf:
    output: "PROVIDER_WILL_FILL_THIS"
    version: 196

  refund_leaf:
    output: "PROVIDER_WILL_FILL_THIS"
    version: 196

  # Network direction: "bitcoin" or "liquid"
  from_network: "bitcoin"
  to_network: "liquid"

  # Optional blinding key (for Liquid transactions)
  blinding_key: null

  timeout_block_height: 0
  server_public_key: "PROVIDER_WILL_FILL_THIS"
  user_lockup_address: "PROVIDER_WILL_FILL_THIS"
  server_lockup_address: "PROVIDER_WILL_FILL_THIS"
  amount: 0
  swap_id: "YOUR_SWAP_ID"

  # Preimage (required for claim, not needed for refund)
  preimage: null
